name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверка типов
        run: pnpm typecheck

      - name: Сборка сайта
        run: pnpm exec vite build

  # Docker-образ собирается: Dockerfile и .dockerignore в порядке
  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t ochakovo:ci .
